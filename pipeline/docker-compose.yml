services:
  pipeline:
    build: .
    container_name: second-brain-pipeline
    env_file: .env
    restart: on-failure
    # cpus/mem_limit invece di deploy.resources.limits: quest'ultimo è affidabile solo in
    # modalità swarm, qui serve un limite applicato anche con `docker compose up` standalone
    # (research.md). Valori di partenza per un host a 4 CPU/16GB condiviso con altri 4 servizi:
    # tarare in base al carico reale una volta scelti i modelli locali di STT/captioning.
    cpus: "2.0"
    mem_limit: "4g"
    volumes:
      - /srv/second-brain/models-cache/pipeline:/models
    networks:
      - second-brain-net

networks:
  second-brain-net:
    external: true
